name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: "",     archive: tar.gz }
          - { goos: linux,   goarch: arm64, ext: "",     archive: tar.gz }
          - { goos: darwin,  goarch: amd64, ext: "",     archive: tar.gz }
          - { goos: darwin,  goarch: arm64, ext: "",     archive: tar.gz }
          - { goos: windows, goarch: amd64, ext: ".exe", archive: zip }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: build
        run: |
          VERSION=${GITHUB_REF_NAME}
          BINARY=license-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
            -o "dist/$BINARY" ./cmd/license-server
      - name: pack
        run: |
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip "license-server-${{ matrix.goos }}-${{ matrix.goarch }}.zip" *
          else
            tar czf "license-server-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" *
          fi
      - name: upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
