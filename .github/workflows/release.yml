name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: "",     archive: tar.gz }
          - { goos: linux,   goarch: arm64, ext: "",     archive: tar.gz }
          - { goos: darwin,  goarch: amd64, ext: "",     archive: tar.gz }
          - { goos: darwin,  goarch: arm64, ext: "",     archive: tar.gz }
          - { goos: windows, goarch: amd64, ext: ".exe", archive: zip }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: build
        run: |
          VERSION=${GITHUB_REF_NAME}
          BINARY=license-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
            -o "dist/$BINARY" ./cmd/license-server
      - name: pack
        run: |
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip "license-server-${{ matrix.goos }}-${{ matrix.goarch }}.zip" *
          else
            tar czf "license-server-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" *
          fi
      - name: upload release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body: |
            ## license-server ${{ github.ref_name }}

            轻量云端 License 鉴权服务端 —— 单二进制 · Ed25519 · 设备绑定席位 · SQLite 单文件。

            ### 下载

            | 平台 | 文件 |
            |---|---|
            | Windows x64 | `license-server-windows-amd64.zip` |
            | Linux x64 / arm64 | `license-server-linux-amd64.tar.gz` · `license-server-linux-arm64.tar.gz` |
            | macOS x64 / arm64 | `license-server-darwin-amd64.tar.gz` · `license-server-darwin-arm64.tar.gz` |

            ### 运行

            ```bash
            LICENSE_ADMIN_KEY=<你的管理Key> ./license-server --addr :8080 --db licenses.db
            ```

            管理台: http://127.0.0.1:8080/admin · Docker 部署与接入指南见 README。
          files: dist/*
